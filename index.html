<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>PDF Viewer</title>
    <meta name="description" content="目次自動生成、ページジャンプ、しおり機能、オフライン閲覧に対応したシンプルなPDFビューワー" />
    <meta property="og:title" content="PDF Viewer" />
    <meta property="og:description" content="目次自動生成、ページジャンプ、しおり機能、オフライン閲覧に対応したシンプルなPDFビューワー" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#BC8F8F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PDF Viewer" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      // Polyfill global Iterator to prevent WebKit/Safari ReferenceError in pdfjs-dist
      if (typeof globalThis.Iterator === 'undefined') {
        globalThis.Iterator = function () {};
        globalThis.Iterator.prototype = {};
      }
      // Ensure React Refresh preamble functions are initialized synchronously
      // Prevents "@vitejs/plugin-react can't detect preamble" in dev/preview iframe environments
      if (typeof window !== 'undefined') {
        window.__vite_plugin_react_preamble_installed__ = true;
        if (!window.$RefreshReg$) {
          window.$RefreshReg$ = function () {};
        }
        if (!window.$RefreshSig$) {
          window.$RefreshSig$ = function () {
            return function (type) {
              return type;
            };
          };
        }
      }
    </script>
  </head>
  <body class="bg-[#FDFBF7] text-[#4A3F35] antialiased selection:bg-[#BC8F8F]/20 selection:text-[#5E3B3B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
