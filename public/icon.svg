<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F2ECE4" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8B5E5E" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="#F7F4EE" />

  <!-- Document Body with Shadow -->
  <g filter="url(#dropShadow)">
    <rect x="110" y="80" width="292" height="352" rx="20" fill="url(#bgGrad)" stroke="#DFD7CC" stroke-width="4" />
    <!-- Fold corner -->
    <path d="M 332 80 L 402 150 L 332 150 Z" fill="#E8DFD3" stroke="#DFD7CC" stroke-width="4" />
    <path d="M 332 80 L 332 150 L 402 150" fill="none" stroke="#DFD7CC" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Rosy Brown Bookmark Ribbon (#BC8F8F) -->
  <path d="M 160 80 L 210 80 L 210 210 L 185 185 L 160 210 Z" fill="#BC8F8F" />

  <!-- Subtle Document Lines -->
  <line x1="230" y1="180" x2="350" y2="180" stroke="#C4B8A8" stroke-width="8" stroke-linecap="round" />
  <line x1="160" y1="250" x2="350" y2="250" stroke="#C4B8A8" stroke-width="8" stroke-linecap="round" />
  <line x1="160" y1="285" x2="330" y2="285" stroke="#D1C6B8" stroke-width="7" stroke-linecap="round" />
  <line x1="160" y1="320" x2="300" y2="320" stroke="#D1C6B8" stroke-width="7" stroke-linecap="round" />

  <!-- PDF Pill Badge (#BC8F8F) -->
  <rect x="160" y="355" width="100" height="40" rx="8" fill="#BC8F8F" />
  <text x="210" y="382" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PDF</text>
</svg>
